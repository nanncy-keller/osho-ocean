<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐠</text></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osho Ocean</title>
    
    <!-- Estilos -->
    <link rel="stylesheet" href="css/ocean-env.css">
    <link rel="stylesheet" href="css/ship-effects.css">
    <link rel="stylesheet" href="css/ui-animations.css">
    <link rel="stylesheet" href="css/main.css">
	
</head>
<body>

<svg class="ship-hull" width="500" height="200" viewBox="0 0 500 200" xmlns="http://www.w3.org/2000/svg">
        <!-- Casco do navio mais anguloso e escuro -->
        <defs>
            <linearGradient id="hullGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#1A1A1A;stop-opacity:1" />
                <stop offset="50%" style="stop-color:#2C2C2C;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#1A1A1A;stop-opacity:1" />
            </linearGradient>
        </defs>
        
        <!-- Proa angulosa (frente) -->
        <path d="M 50,40 L 30,60 L 30,110 L 45,140 L 65,145" 
              fill="url(#hullGradient)" 
              stroke="#0D0D0D" 
              stroke-width="3"/>
        
        <!-- Corpo principal do casco -->
        <path d="M 65,145 L 435,145 L 450,140 L 470,110 L 470,60 L 450,40 L 65,40 Z" 
              fill="url(#hullGradient)" 
              stroke="#0D0D0D" 
              stroke-width="3"/>
        
        <!-- Popa angulosa (traseira) -->
        <path d="M 435,145 L 450,140 L 470,110 L 470,60 L 450,40" 
              fill="#1F1F1F" 
              stroke="#0D0D0D" 
              stroke-width="3"/>
        
        <!-- Detalhes metálicos -->
        <rect x="60" y="80" width="380" height="3" fill="#3A3A3A" opacity="0.8"/>
        <rect x="60" y="100" width="380" height="3" fill="#3A3A3A" opacity="0.8"/>
        <rect x="60" y="120" width="380" height="3" fill="#3A3A3A" opacity="0.8"/>
        
        <!-- Janelas/portinholas -->
        <circle cx="120" cy="70" r="10" fill="#0D0D0D" opacity="0.9"/>
        <circle cx="180" cy="70" r="10" fill="#0D0D0D" opacity="0.9"/>
        <circle cx="240" cy="70" r="10" fill="#0D0D0D" opacity="0.9"/>
        <circle cx="300" cy="70" r="10" fill="#0D0D0D" opacity="0.9"/>
        <circle cx="360" cy="70" r="10" fill="#0D0D0D" opacity="0.9"/>
        <circle cx="420" cy="70" r="10" fill="#0D0D0D" opacity="0.9"/>
        
        <!-- Rebites -->
        <circle cx="80" cy="90" r="2" fill="#4A4A4A"/>
        <circle cx="100" cy="90" r="2" fill="#4A4A4A"/>
        <circle cx="120" cy="90" r="2" fill="#4A4A4A"/>
        <circle cx="80" cy="110" r="2" fill="#4A4A4A"/>
        <circle cx="100" cy="110" r="2" fill="#4A4A4A"/>
        <circle cx="120" cy="110" r="2" fill="#4A4A4A"/>
        
        <!-- Nome do navio -->
        <text x="250" y="110" 
              font-family="Arial, sans-serif" 
              font-size="16" 
              font-weight="bold"
              fill="#CCCCCC" 
              text-anchor="middle"
              opacity="0.9"
              letter-spacing="2">OSHO EXPLORER</text>
       
        <!-- Linha d'água e sombra -->
        <ellipse cx="250" cy="145" rx="200" ry="15" fill="rgba(0, 50, 80, 0.3)"/>
    </svg>


<!-- ÂNCORA SEPARADA (para ficar na frente) -->
<svg id="anchor-svg" style="position: fixed; top: -50px; left: 50%; transform: translateX(-50%); z-index: 100; pointer-events: none; width: 500px; height: 300px;" viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg">
    <g id="anchor" transform="translate(380, 145)">
        <!-- CORDA/CORRENTE completa -->
        <line x1="0" y1="-145" x2="0" y2="25" stroke="#5A5A5A" stroke-width="3" class="anchor-rope"/>
        
        <!-- Elos da corrente ao longo da corda -->
        <ellipse cx="0" cy="-130" rx="4" ry="3" fill="none" stroke="#5A5A5A" stroke-width="2" class="anchor-rope"/>
        <ellipse cx="0" cy="-115" rx="4" ry="3" fill="none" stroke="#5A5A5A" stroke-width="2" class="anchor-rope"/>
        <ellipse cx="0" cy="-100" rx="4" ry="3" fill="none" stroke="#5A5A5A" stroke-width="2" class="anchor-rope"/>
        <ellipse cx="0" cy="-85" rx="4" ry="3" fill="none" stroke="#5A5A5A" stroke-width="2" class="anchor-rope"/>
        <ellipse cx="0" cy="-70" rx="4" ry="3" fill="none" stroke="#5A5A5A" stroke-width="2" class="anchor-rope"/>
        <ellipse cx="0" cy="-55" rx="4" ry="3" fill="none" stroke="#5A5A5A" stroke-width="2" class="anchor-rope"/>
        <ellipse cx="0" cy="-40" rx="4" ry="3" fill="none" stroke="#5A5A5A" stroke-width="2" class="anchor-rope"/>
        <ellipse cx="0" cy="-25" rx="4" ry="3" fill="none" stroke="#5A5A5A" stroke-width="2" class="anchor-rope"/>
        <ellipse cx="0" cy="-10" rx="4" ry="3" fill="none" stroke="#5A5A5A" stroke-width="2" class="anchor-rope"/>
        
        <!-- Elos próximos à âncora -->
        <circle cx="0" cy="8" r="3" fill="none" stroke="#5A5A5A" stroke-width="2"/>
        <circle cx="0" cy="17" r="3" fill="none" stroke="#5A5A5A" stroke-width="2"/>
        
        <!-- Corpo da âncora -->
        <line x1="0" y1="25" x2="0" y2="55" stroke="#4A4A4A" stroke-width="4"/>
        
        <!-- Anel superior -->
        <circle cx="0" cy="25" r="5" fill="none" stroke="#4A4A4A" stroke-width="3"/>
        
        <!-- Braços da âncora -->
        <path d="M -15,45 Q -15,52 -10,55 L 0,50 L 10,55 Q 15,52 15,45" 
              fill="none" 
              stroke="#4A4A4A" 
              stroke-width="4"
              stroke-linecap="round"/>
        
        <!-- Pontas dos braços -->
        <circle cx="-10" cy="55" r="3" fill="#4A4A4A"/>
        <circle cx="10" cy="55" r="3" fill="#4A4A4A"/>
        
        <!-- Ganchos -->
        <path d="M -10,55 L -13,58 L -11,60" 
              fill="none" 
              stroke="#4A4A4A" 
              stroke-width="2"
              stroke-linecap="round"/>
        <path d="M 10,55 L 13,58 L 11,60" 
              fill="none" 
              stroke="#4A4A4A" 
              stroke-width="2"
              linecap="round"/>
    </g>
</svg>


<!-- LINHA DE PESCA -->


<svg id="fishing-line-svg" style="position: fixed; top: 0; left: 5%; z-index: 5; pointer-events: none; width: 300px; height: 100vh;" viewBox="0 0 100 800" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Filtro para efeito de água -->
        <filter id="underwater-effect">
            <feGaussianBlur in="SourceGraphic" stdDeviation="0.4"/>
            <feColorMatrix type="matrix" values="
                0.7 0   0.15 0 0
                0.15 0.8 0.25 0 0
                0.25 0.35 0.9 0 0
                0   0   0   1 0"/>
        </filter>
        
        <!-- Gradiente para o peixe -->
        <linearGradient id="fishGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#FFA07A;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#FF8C69;stop-opacity:1" />
        </linearGradient>
    </defs>
    
    <!-- Linha de pesca mais visível com leve tom azulado -->
    <line x1="50" y1="0" x2="50" y2="250" stroke="#1a1a1a" stroke-width="2" opacity="0.85"/>
    <line x1="50" y1="0" x2="50" y2="250" stroke="#2a9fd8" stroke-width="1" opacity="0.4" filter="url(#underwater-effect)"/>
    
    <!-- Anzol dourado mais visível -->
    <g transform="translate(50, 250) scale(0.8)" filter="url(#underwater-effect)">
        <line x1="0" y1="0" x2="0" y2="25" stroke="#B8860B" stroke-width="3"/>
        <line x1="0" y1="0" x2="0" y2="25" stroke="#FFD700" stroke-width="2.2"/>
        
        <path d="M 0,25 Q -10,30 -12,38 Q -12,42 -8,45" 
              fill="none" 
              stroke="#B8860B" 
              stroke-width="3"
              stroke-linecap="round"/>
        <path d="M 0,25 Q -10,30 -12,38 Q -12,42 -8,45" 
              fill="none" 
              stroke="#FFD700" 
              stroke-width="2.2"
              stroke-linecap="round"/>
        
        <!-- Ponta afiada do gancho VISÍVEL -->
        <path d="M -8,45 L -5,50 L -3,44" 
              fill="none" 
              stroke="#B8860B" 
              stroke-width="3"
              stroke-linecap="round"/>
        <path d="M -8,45 L -5,50 L -3,44" 
              fill="none" 
              stroke="#FFD700" 
              stroke-width="2.2"
              stroke-linecap="round"/>
        
        <!-- Brilho dourado -->
        <line x1="-1" y1="28" x2="-1" y2="36" 
              stroke="#FFFF00" 
              stroke-width="1.2"
              opacity="0.9"/>
        
        <!-- Ponta afiada extra visível saindo da minhoca -->
        <line x1="-5" y1="50" x2="-4" y2="54" 
              stroke="#B8860B" 
              stroke-width="2.5"
              stroke-linecap="round"/>
        <line x1="-5" y1="50" x2="-4" y2="54" 
              stroke="#FFD700" 
              stroke-width="1.8"
              stroke-linecap="round"/>
    </g>
    
    <!-- MINHOCA PENDURADA NO ANZOL -->
    <g transform="translate(50, 280) scale(0.8)" filter="url(#underwater-effect)">
        <!-- Corpo da minhoca segmentado com movimento -->
        <g class="worm-body">
            <!-- Segmento superior (preso ao anzol) -->
            <ellipse cx="-8" cy="0" rx="3" ry="5" fill="#8B4513" stroke="#654321" stroke-width="0.8" opacity="0.9">
                <animate attributeName="ry" values="5;6;5" dur="1.5s" repeatCount="indefinite"/>
            </ellipse>
            
            <!-- Segmento 1 -->
            <ellipse cx="-8" cy="8" rx="3.5" ry="6" fill="#A0522D" stroke="#654321" stroke-width="0.8" opacity="0.9">
                <animate attributeName="cx" values="-8;-10;-6;-8" dur="2s" repeatCount="indefinite"/>
                <animate attributeName="ry" values="6;7;6" dur="1.8s" repeatCount="indefinite"/>
            </ellipse>
            
            <!-- Segmento 2 -->
            <ellipse cx="-8" cy="16" rx="4" ry="7" fill="#8B4513" stroke="#654321" stroke-width="0.8" opacity="0.9">
                <animate attributeName="cx" values="-8;-6;-10;-8" dur="2.2s" repeatCount="indefinite"/>
                <animate attributeName="ry" values="7;8;7" dur="2s" repeatCount="indefinite"/>
            </ellipse>
            
            <!-- Segmento 3 (meio - mais grosso) -->
            <ellipse cx="-8" cy="25" rx="4.5" ry="8" fill="#A0522D" stroke="#654321" stroke-width="0.8" opacity="0.9">
                <animate attributeName="cx" values="-8;-11;-5;-8" dur="2.5s" repeatCount="indefinite"/>
                <animate attributeName="ry" values="8;9;8" dur="2.3s" repeatCount="indefinite"/>
            </ellipse>
            
            <!-- Segmento 4 -->
            <ellipse cx="-8" cy="35" rx="4" ry="7" fill="#8B4513" stroke="#654321" stroke-width="0.8" opacity="0.9">
                <animate attributeName="cx" values="-8;-5;-11;-8" dur="2.8s" repeatCount="indefinite"/>
                <animate attributeName="ry" values="7;8;7" dur="2.5s" repeatCount="indefinite"/>
            </ellipse>
            
            <!-- Segmento 5 -->
            <ellipse cx="-8" cy="44" rx="3.5" ry="6" fill="#A0522D" stroke="#654321" stroke-width="0.8" opacity="0.9">
                <animate attributeName="cx" values="-8;-10;-6;-8" dur="3s" repeatCount="indefinite"/>
                <animate attributeName="ry" values="6;7;6" dur="2.7s" repeatCount="indefinite"/>
            </ellipse>
            
            <!-- Segmento inferior (ponta da minhoca) -->
            <ellipse cx="-8" cy="52" rx="3" ry="5" fill="#8B4513" stroke="#654321" stroke-width="0.8" opacity="0.9">
                <animate attributeName="cx" values="-8;-12;-4;-8" dur="3.2s" repeatCount="indefinite"/>
                <animate attributeName="ry" values="5;6;5" dur="3s" repeatCount="indefinite"/>
            </ellipse>
            
            <!-- Ponta arredondada -->
            <circle cx="-8" cy="56" r="2.5" fill="#654321" opacity="0.8">
                <animate attributeName="cx" values="-8;-13;-3;-8" dur="3.2s" repeatCount="indefinite"/>
            </circle>
            
            <!-- Anéis/segmentação da minhoca -->
            <line x1="-11" y1="5" x2="-5" y2="5" stroke="#654321" stroke-width="0.5" opacity="0.5"/>
            <line x1="-11" y1="12" x2="-5" y2="12" stroke="#654321" stroke-width="0.5" opacity="0.5"/>
            <line x1="-12" y1="20" x2="-4" y2="20" stroke="#654321" stroke-width="0.5" opacity="0.5"/>
            <line x1="-11" y1="29" x2="-5" y2="29" stroke="#654321" stroke-width="0.5" opacity="0.5"/>
            <line x1="-11" y1="39" x2="-5" y2="39" stroke="#654321" stroke-width="0.5" opacity="0.5"/>
            <line x1="-11" y1="48" x2="-5" y2="48" stroke="#654321" stroke-width="0.5" opacity="0.5"/>
            
            <!-- Brilho úmido na minhoca -->
            <ellipse cx="-6" cy="15" rx="1.5" ry="3" fill="white" opacity="0.3"/>
            <ellipse cx="-6" cy="28" rx="1.5" ry="3" fill="white" opacity="0.25"/>
            <ellipse cx="-6" cy="42" rx="1.5" ry="2.5" fill="white" opacity="0.2"/>
        </g>
        
        <!-- Bolhas ao redor da minhoca -->
        <circle cx="-18" cy="25" r="2" fill="none" stroke="#4FC3F7" stroke-width="1" opacity="0.6">
            <animate attributeName="r" values="2;2.5;2" dur="2s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="2" cy="35" r="1.5" fill="none" stroke="#4FC3F7" stroke-width="0.8" opacity="0.5">
            <animate attributeName="r" values="1.5;2;1.5" dur="2.5s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-15" cy="48" r="1.8" fill="none" stroke="#80deea" stroke-width="0.9" opacity="0.55">
            <animate attributeName="r" values="1.8;2.3;1.8" dur="3s" repeatCount="indefinite"/>
        </circle>
    </g>
</svg>

    <header>
        <h1>Osho Ocean</h1>
        <p class="subtitle">Take a Mystical Dive</p>
    </header>

    <!-- Elementos de fundo e efeitos visuais -->
    <div class="fish-container" id="fishContainer"></div>

    <div class="card-container">
      <div class="card">
         <div class="quote-text" id="quoteText">  Click the button below to receive Osho's wisdom </div>
         <div class="author" id="author"></div>
         
         <!-- Botão de copiar -->
         <button class="copy-button" id="copyBtn" title="Copy to clipboard">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
               <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
               <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span class="copy-tooltip">Copied!</span>
         </button>
      </div>
    </div>

    <div class="button-container">
        <button class="shell-button" id="newQuoteBtn">
            <img src="images/shell.png" alt="Shell">
        </button>
        <div class="button-text">Click for a Wisdom Dive</div>
    </div>

    <!-- Scripts -->
    <script src="js/sea-life.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
